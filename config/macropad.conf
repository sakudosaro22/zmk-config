# Nice!Nano v2 Macropad Config

# Enable Bluetooth
CONFIG_BT=y
CONFIG_ZMK_BLE=y

# Enable USB (for wired use / flashing)
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# Enable encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable encoder key bindings
CONFIG_ZMK_ENCODER=y

# Power management (Nice!Nano v2 has onboard battery support)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # 15 minutes

# Optional: Underglow/LED (comment out if not used)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
